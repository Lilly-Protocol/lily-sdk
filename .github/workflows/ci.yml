name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify npm pack contents
        run: |
          PACK_OUTPUT=$(npm pack --dry-run --json)
          echo "$PACK_OUTPUT" | jq -e '
            .[0].files
            | map(.path)
            | map(select(test("\\.(map|cts)$") | not))
            | map(select(startswith("dist/types-") | not))
            | sort
          ' > /tmp/pack-files.json
          echo '["LICENSE","README.md","dist/config.cjs","dist/config.d.ts","dist/config.js","dist/errors.cjs","dist/errors.d.ts","dist/errors.js","dist/http.cjs","dist/http.d.ts","dist/http.js","dist/index.cjs","dist/index.d.ts","dist/index.js","dist/models.cjs","dist/models.d.ts","dist/models.js","dist/types.cjs","dist/types.d.ts","dist/types.js","package.json"]' > /tmp/expected.json
          if ! jq --slurpfile expected /tmp/expected.json -e '. == $expected[0]' /tmp/pack-files.json > /dev/null; then
            echo "Unexpected files in npm pack output:"
            diff <(jq . /tmp/expected.json) <(jq . /tmp/pack-files.json)
            exit 1
          fi
          echo "Pack contents verified"
